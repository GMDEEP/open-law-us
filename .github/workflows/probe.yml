name: probe-sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          set +e
          mkdir -p out
          UA="open-law-us/0.1 (+https://github.com/GMDEEP/open-law-us; stewart@leadmachinellc.com)"
          B="https://www.leg.state.fl.us/statutes/index.cfm"
          get(){ curl -sSL -A "$UA" -w "%{http_code} %{url_effective}\n" -o "out/$1" "$2" >> out/_status.txt; sleep 3; }
          get family_rules.pdf "https://www-media.floridabar.org/uploads/2026/09/2027_04-OCT-Family-Law-Rules-of-Procedure-10-1-2026.pdf"
          get flcourts_rules.html "https://www.flcourts.gov/Resources-Services/Office-of-the-State-Courts-Administrator/Florida-Court-Rules"
          get cl_search.json "https://www.courtlistener.com/api/rest/v4/search/?type=o&court=fladistctapp&q=%22parenting%20plan%22&order_by=dateFiled%20desc"
          get cl_dca_court.json "https://www.courtlistener.com/api/rest/v4/courts/fladistctapp/"
          get cl_courts_fl.json "https://www.courtlistener.com/api/rest/v4/courts/?jurisdiction=S&short_name__icontains=Florida"
          get cl_opinions.json "https://www.courtlistener.com/api/rest/v4/opinions/?cluster__docket__court=fladistctapp&page_size=1"
          get ch741_full.html "$B?App_mode=Display_Statute&URL=0700-0799/0741/0741.html"
          get title_xliii.html "$B?App_mode=Display_Index&Title_Request=XLIII"
          ls -la out >> out/_status.txt
      - name: Commit samples to probe-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-out
          git rm -rf --cached . >/dev/null
          git add out
          git commit -m "probe output" -q
          git push -f origin probe-out
